name: Build manifest-review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A second push must not overtake the first mid-deploy. Queue rather than
# cancel: cancelling between build and deploy could leave the app pointed at
# an image nobody chose.
concurrency:
  group: deploy-manifest-review
  cancel-in-progress: false

env:
  REGISTRY: acrtmsdevukw01
  IMAGE: manifest-review
  APP: ca-manifest-review
  RG: rg-tms-dev-ukw-app-01

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Apps does not re-pull when a tag moves, so building alone
      # leaves the new image in ACR while the old revision keeps serving.
      # Deploy the immutable SHA tag rather than :latest, so every revision
      # names the exact commit it runs and rollback is one command.
      - name: Deploy to Container App
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}" \
            --revision-suffix "s${SHORT_SHA}-${{ github.run_number }}" \
            --output none

      - name: Report what is now live
        run: |
          az containerapp show --name "$APP" --resource-group "$RG" \
            --query "{image:properties.template.containers[0].image, revision:properties.latestReadyRevisionName, fqdn:properties.configuration.ingress.fqdn}" \
            --output yaml
